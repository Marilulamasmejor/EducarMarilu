<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bomberos Matemáticos</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    background:linear-gradient(to bottom,#87CEEB,#FFFFFF);
}

h1{
    color:#cc0000;
}

#panel{
    font-size:28px;
    font-weight:bold;
    margin:15px;
}

#ciudad{
    width:95%;
    max-width:900px;
    margin:auto;
}

#camionContainer{
    height:140px;
    position:relative;
}

#camion{
    position:absolute;
    left:0;
    top:10px;
    font-size:110px;
    transition:left 1.5s ease;
}

#casasGrid{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:30px;

    max-width:700px;

    margin:20px auto;
}

.casa{

    position:relative;

    font-size:100px;
}

.fuego{

    position:absolute;

    top:-10px;

    right:-10px;

    font-size:50px;

    animation:parpadear .8s infinite alternate;
}

@keyframes parpadear{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.2);
    }
}

#operacion{

    font-size:48px;

    color:#003366;

    font-weight:bold;

    margin-top:25px;
}

#zonaObjetivo{

    width:220px;

    height:120px;

    margin:25px auto;

    border:4px dashed orange;

    border-radius:20px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:50px;

    background:#fff3e0;

    transition:.3s;
}

#respuestas{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:20px;

    margin-top:20px;
}

.respuesta{

    width:120px;

    padding:15px;

    background:#00BFFF;

    color:white;

    border-radius:15px;

    font-size:28px;

    font-weight:bold;

    cursor:grab;

    user-select:none;

    transition:.2s;
}

.respuesta:hover{
    transform:scale(1.08);
}

#mensaje{

    min-height:50px;

    font-size:28px;

    font-weight:bold;

    margin-top:20px;
}

.agua{

    position:absolute;

    font-size:45px;

    z-index:1000;

    pointer-events:none;
}

.estrella{

    position:fixed;

    font-size:35px;

    animation:caer 1.5s linear forwards;
}

@keyframes caer{

    from{
        opacity:1;
        transform:translateY(0);
    }

    to{
        opacity:0;
        transform:translateY(200px);
    }
}

#final{

    display:none;

    font-size:42px;

    color:green;

    margin-top:30px;
}

button{

    padding:12px 25px;

    font-size:22px;

    border:none;

    border-radius:12px;

    cursor:pointer;
}

.confeti{

    position:fixed;

    width:12px;

    height:12px;

    top:-20px;

    z-index:9999;

    animation:confetiCaer 4s linear forwards;
}

@keyframes confetiCaer{

    from{

        transform:
        translateY(0)
        rotate(0deg);

        opacity:1;
    }

    to{

        transform:
        translateY(110vh)
        rotate(720deg);

        opacity:0;
    }
}

</style>
</head>
<body>

<h1>🚒 Bomberos Matemáticos</h1>

<div id="panel">
🏠 Casas apagadas:
<span id="contador">0</span>/6
</div>

<div id="ciudad">

    <div id="camionContainer">
        <div id="camion">🚒</div>
    </div>

    <div id="casasGrid"></div>

</div>

<div id="operacion"></div>

<div id="zonaObjetivo">
💧➡️🔥
</div>

<div id="respuestas"></div>

<div id="mensaje"></div>

<div id="final"></div>

<script>

let respuestaCorrecta;
let casasApagadas=0;
let puedeResponder=false;
let casas=[];

let puntajeTotal =
Number(localStorage.getItem("puntajeTotal")) || 0;

let juegosCompletados =
JSON.parse(localStorage.getItem("juegosCompletados")) || [];

function guardarPuntaje(puntos,nombreJuego){

    puntajeTotal += puntos;

    localStorage.setItem(
        "puntajeTotal",
        puntajeTotal
    );

    if(!juegosCompletados.includes(nombreJuego)){

        juegosCompletados.push(nombreJuego);

        localStorage.setItem(
            "juegosCompletados",
            JSON.stringify(juegosCompletados)
        );
    }

    if(juegosCompletados.length >= 6){

        location.href="final_juega.html";
    }
}

function crearCiudad(){

    let grid=
    document.getElementById("casasGrid");

    for(let i=0;i<6;i++){

        let casa=
        document.createElement("div");

        casa.className="casa";

        casa.innerHTML=
        `
        🏠
        <div class="fuego">🔥</div>
        `;

        casas.push(casa);

        grid.appendChild(casa);
    }
}

function hablar(texto,callback){

    speechSynthesis.cancel();

    let voz=
    new SpeechSynthesisUtterance(texto);

    voz.lang="es-ES";
    voz.rate=1.1;

    voz.onend=function(){

        if(callback) callback();
    };

    speechSynthesis.speak(voz);
}

function numero3Digitos(){

    return Math.floor(Math.random()*900)+100;
}

function nuevaOperacion(){

    puedeResponder=false;

    zonaObjetivo.style.pointerEvents="none";
    zonaObjetivo.style.opacity=".4";

    mensaje.innerHTML=
    "🎤 Escucha la operación";

    let tipo=
    Math.floor(Math.random()*4)+1;

    let a,b;

    if(tipo===1){

        a=numero3Digitos();
        b=numero3Digitos();

        respuestaCorrecta=a+b;

        operacion.innerHTML=
        `${a} + ${b}`;
    }

    if(tipo===2){

        a=numero3Digitos();
        b=numero3Digitos();

        if(b>a){

            let aux=a;
            a=b;
            b=aux;
        }

        respuestaCorrecta=a-b;

        operacion.innerHTML=
        `${a} - ${b}`;
    }

    if(tipo===3){

        a=Math.floor(Math.random()*11)+2;
        b=Math.floor(Math.random()*11)+2;

        respuestaCorrecta=a*b;

        operacion.innerHTML=
        `${a} × ${b}`;
    }

    if(tipo===4){

        b=Math.floor(Math.random()*11)+2;

        respuestaCorrecta=
        Math.floor(Math.random()*11)+2;

        a=b*respuestaCorrecta;

        operacion.innerHTML=
        `${a} ÷ ${b}`;
    }

    crearOpciones();

    hablar(
        operacion.innerText,
        function(){

            puedeResponder=true;

            zonaObjetivo.style.pointerEvents="auto";
            zonaObjetivo.style.opacity="1";

            mensaje.innerHTML=
            "💧 Arrastra la respuesta correcta";
        }
    );
}

function crearOpciones(){

    let opciones=[respuestaCorrecta];

    while(opciones.length<4){

        let falsa=
        respuestaCorrecta+
        Math.floor(Math.random()*50)-25;

        if(
            falsa>0 &&
            !opciones.includes(falsa)
        ){
            opciones.push(falsa);
        }
    }

    opciones.sort(
        ()=>Math.random()-0.5
    );

    respuestas.innerHTML="";

    opciones.forEach(function(valor){

        let div=
        document.createElement("div");

        div.className="respuesta";

        div.draggable=true;

        div.dataset.valor=valor;

        div.innerHTML=
        "💧 "+valor;

        div.addEventListener(
        "dragstart",
        function(e){

            if(!puedeResponder){

                e.preventDefault();
                return;
            }

            e.dataTransfer.setData(
            "text",
            valor
            );
        });

        respuestas.appendChild(div);
    });
}

zonaObjetivo.addEventListener(
"dragover",
e=>e.preventDefault()
);

zonaObjetivo.addEventListener(
"drop",
function(e){

    e.preventDefault();

    if(!puedeResponder) return;

    let valor=
    Number(
    e.dataTransfer.getData("text")
    );

    verificar(valor);
});

function moverCamion(casa,callback){

    const camion=
    document.getElementById("camion");

    const ciudad=
    document.getElementById("ciudad");

    const casaRect=
    casa.getBoundingClientRect();

    const ciudadRect=
    ciudad.getBoundingClientRect();

    const destino=
    casaRect.left-ciudadRect.left-20;

    camion.style.left=
    destino+"px";

    setTimeout(callback,1500);
}

function lanzarAgua(casa){

    const ciudad=
    document.getElementById("ciudad");

    const agua=
    document.createElement("div");

    agua.className="agua";
    agua.innerHTML="💦";

    ciudad.appendChild(agua);

    const camion=
    document.getElementById("camion")
    .getBoundingClientRect();

    const destino=
    casa.getBoundingClientRect();

    agua.style.left=
    (camion.left+40)+"px";

    agua.style.top=
    (camion.top+50)+"px";

    let x=
    destino.left-camion.left;

    let y=
    destino.top-camion.top;

    agua.animate(
    [
        {transform:"translate(0,0)"},
        {transform:`translate(${x}px,${y}px)`}
    ],
    {
        duration:700,
        easing:"linear"
    });

    setTimeout(
    ()=>agua.remove(),
    700);
}

function estrellas(){

    for(let i=0;i<10;i++){

        let estrella=
        document.createElement("div");

        estrella.className="estrella";

        estrella.innerHTML="⭐";

        estrella.style.left=
        Math.random()*window.innerWidth+"px";

        estrella.style.top="100px";

        document.body.appendChild(estrella);

        setTimeout(
        ()=>estrella.remove(),
        1500
        );
    }
}

function verificar(valor){

    if(valor!==respuestaCorrecta){

        mensaje.innerHTML=
        "❌ Incorrecto";

        hablar(
        "Incorrecto. Intenta nuevamente."
        );

        return;
    }

    mensaje.innerHTML=
    "✅ ¡Correcto!";

    puedeResponder=false;

    const casa=
    casas[casasApagadas];

    moverCamion(
    casa,
    function(){

        lanzarAgua(casa);

        setTimeout(function(){

            casa.querySelector(".fuego")
            .innerHTML="💨";

            estrellas();

        },700);
    });

    hablar(
    "Correcto. Incendio apagado."
    );

    casasApagadas++;

    contador.innerHTML=
    casasApagadas;

    if(casasApagadas>=6){

        setTimeout(
        ganar,
        2800
        );

        return;
    }

    setTimeout(
    nuevaOperacion,
    3200
    );
}

function lanzarConfeti(){

    const colores=[
        "#ff0000",
        "#00ccff",
        "#ffff00",
        "#00cc66",
        "#ff66cc",
        "#ff9900",
        "#9933ff"
    ];

    for(let i=0;i<250;i++){

        let confeti=
        document.createElement("div");

        confeti.className="confeti";

        confeti.style.left=
        Math.random()*100+"vw";

        confeti.style.background=
        colores[
            Math.floor(
                Math.random()*colores.length
            )
        ];

        confeti.style.animationDuration=
        (Math.random()*2+3)+"s";

        document.body.appendChild(confeti);

        setTimeout(
        ()=>confeti.remove(),
        5000
        );
    }
}

function ganar(){

    guardarPuntaje(60,"Bomberos");

    lanzarConfeti();
    estrellas();
    estrellas();
    estrellas();
    operacion.style.display="none";
    respuestas.style.display="none";
    zonaObjetivo.style.display="none";
    mensaje.style.display="none";

    final.style.display="block";

    final.innerHTML=
    `
    🚒🏆

    <br><br>

    ¡Ciudad salvada!

    <br><br>

    Has apagado los 6 incendios.

    <br><br>

    <button onclick="location.reload()">
    🔄 Jugar otra vez
    </button>
    `;

    hablar(
    "Felicitaciones. Has salvado toda la ciudad."
    );
}

window.onload=function(){

    crearCiudad();

    hablar(
    "Bomberos matemáticos. Resuelve las operaciones para apagar los seis incendios.",
    function(){

        nuevaOperacion();

    });
};

</script>

</body>
</html>
