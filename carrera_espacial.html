<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrera Espacial</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    text-align:center;
    color:white;
    overflow:hidden;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:linear-gradient(to bottom,#001133,#000000);

    background-size:cover;
    filter:blur(12px);
    transform:scale(1.1);

    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:rgba(0,0,0,0.35);

    z-index:-1;
}

h1{
    color:#00ffff;
}

#info{
    font-size:25px;
    margin:15px;
}

#espacio{
    position:relative;
    width:90%;
    max-width:1000px;
    height:220px;
    margin:auto;
    border:4px solid #00ffff;
    border-radius:20px;
    background:#000022;
    overflow:hidden;
}

#nave{
    position:absolute;
    left:10px;
    top:70px;
    font-size:70px;
    transition:all 0.8s;
    animation:flotar 1s infinite alternate;
}

@keyframes flotar{

    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(-10px);
    }
}

#planeta{
    position:absolute;
    right:20px;
    top:55px;
    font-size:90px;
}

#operacion{
    font-size:40px;
    color:#ffff66;
    margin-top:25px;
}

input{
    font-size:28px;
    width:180px;
    text-align:center;
    padding:10px;
    border-radius:10px;
}

button{
    padding:12px 25px;
    font-size:20px;
    margin:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#00bfff;
    color:white;
}

button:hover{
    background:#0099cc;
}

#mensaje{
    font-size:28px;
    font-weight:bold;
    min-height:40px;
    margin-top:10px;
}

#final{
    display:none;
    font-size:40px;
    color:#00ff99;
    margin-top:25px;
}

.estrella{
    position:fixed;
    color:white;
    pointer-events:none;
    animation:brillo 2s linear infinite;
}

@keyframes brillo{
    0%{opacity:0.2}
    50%{opacity:1}
    100%{opacity:0.2}
}

#fondo-estrellas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-3;
    pointer-events:none;
}

#espacio, #operacion, #info, input, button, h1{
    position:relative;
    z-index:2;
}

.confeti{
    position:fixed;
    top:-10px;
    font-size:20px;
    animation:caer 3s linear forwards;
    pointer-events:none;
    z-index:9999;
}

@keyframes caer{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

</style>
</head>
<body>

    <div id="fondo-estrellas"></div>

<h1>🚀 Carrera Espacial</h1>

<div id="info">
Respuestas correctas:
<span id="correctas">0</span> / 10
</div>

<div id="espacio">
    <div id="nave">🚀</div>
    <div id="planeta">🪐</div>
</div>

<div id="operacion"></div>

<input type="number" id="respuesta">

<br>

<button onclick="verificar()">Responder</button>

<div id="mensaje"></div>

<div id="final"></div>
<button id="volverMenu" onclick="volverMenu()">
🏠 Volver al menú
</button>


<script>

let respuestaCorrecta;
let aciertos = 0;
let posicion = 0;

let puntajeTotal =
Number(localStorage.getItem("puntajeTotal")) || 0;

let juegosCompletados =
JSON.parse(localStorage.getItem("juegosCompletados")) || [];

function guardarPuntaje(puntos,nombreJuego){

    puntajeTotal += puntos;

    localStorage.setItem(
        "puntajeTotal",
        puntajeTotal
    );

    if(!juegosCompletados.includes(nombreJuego)){

        juegosCompletados.push(nombreJuego);

        localStorage.setItem(
            "juegosCompletados",
            JSON.stringify(juegosCompletados)
        );
    }

    if(juegosCompletados.length >= 6){

        location.href="final_juega.html";
    }
}

function hablar(texto){

    speechSynthesis.cancel();

    let voz = new SpeechSynthesisUtterance(texto);

    voz.lang = "es-ES";
    voz.rate = 1;

    speechSynthesis.speak(voz);
}

window.onload = function(){

    crearEstrellasFondo();

    for(let i=0;i<50;i++){

    let estrella=document.createElement("div");

    estrella.className="estrella";
    estrella.innerHTML="⭐";

    estrella.style.left=Math.random()*100+"vw";
    estrella.style.top=Math.random()*100+"vh";

    estrella.style.fontSize=
    (Math.random()*15+10)+"px";

    document.body.appendChild(estrella);
}

    hablar(
    "Carrera espacial. Resuelve las operaciones para ayudar a la nave a llegar al planeta."
    );

    nuevaOperacion();
};

function numero3Digitos(){
    return Math.floor(Math.random()*900)+100;
}

function nuevaOperacion(){

    let tipo = Math.floor(Math.random()*4)+1;

    let a,b;

    if(tipo===1){

        a = numero3Digitos();
        b = numero3Digitos();

        respuestaCorrecta = a+b;

        document.getElementById("operacion").innerHTML =
        a + " más " + b;
    }

    if(tipo===2){

        a = numero3Digitos();
        b = numero3Digitos();

        if(b>a){
            let aux=a;
            a=b;
            b=aux;
        }

        respuestaCorrecta = a-b;

        document.getElementById("operacion").innerHTML =
        a + " menos " + b;
    }

    if(tipo===3){

        a = Math.floor(Math.random()*11)+2;
        b = Math.floor(Math.random()*11)+2;

        respuestaCorrecta = a*b;

        document.getElementById("operacion").innerHTML =
        a + " por " + b;
    }

    if(tipo===4){

        b = Math.floor(Math.random()*11)+2;

        respuestaCorrecta =
        Math.floor(Math.random()*11)+2;

        a = respuestaCorrecta*b;

        document.getElementById("operacion").innerHTML =
        a + " dividido entre " + b;
    }

    document.getElementById("respuesta").value="";

    leerOperacion(
    document.getElementById("operacion").innerText
    );
}

function verificar(){

    let r = Number(
    document.getElementById("respuesta").value
    );

    if(r===respuestaCorrecta){

        aciertos++;

        document.getElementById("correctas").innerHTML =
        aciertos;

        document.getElementById("mensaje").innerHTML =
        "✅ ¡Muy bien!";

        hablar("Muy bien");

        moverNave();

    }else{

        document.getElementById("mensaje").innerHTML =
        "❌ Inténtalo nuevamente";

        hablar("Inténtalo nuevamente");
    }

    if(aciertos<10){
        nuevaOperacion();
    }
}

function moverNave(){

    posicion += 9;

    document.getElementById("nave").style.left =
    posicion + "%";

    if(aciertos>=10){

        guardarPuntaje(100,"Espacial");

        lanzarConfeti();

        document.getElementById("operacion").style.display="none";
        document.getElementById("respuesta").style.display="none";
        document.querySelector("button").style.display="none";

        document.getElementById("final").style.display="block";

        document.getElementById("final").innerHTML =
        "🏆 ¡Llegaste al planeta!";

        hablar(
        "Felicitaciones. Has llegado al planeta."
        );
    }
}

function lluviaEstrellas(){

    for(let i=0;i<15;i++){

        let estrella=document.createElement("div");

        estrella.innerHTML="⭐";

        estrella.style.position="fixed";
        estrella.style.left=
        Math.random()*window.innerWidth+"px";

        estrella.style.top="100px";

        estrella.style.fontSize="35px";

        document.body.appendChild(estrella);

        let y=100;

        let anim=setInterval(function(){

            y+=8;

            estrella.style.top=y+"px";

            if(y>window.innerHeight){

                clearInterval(anim);
                estrella.remove();
            }

        },20);
    }
}

function leerOperacion(texto){

    let voz=
    new SpeechSynthesisUtterance(texto);

    voz.lang="es-ES";

    speechSynthesis.speak(voz);
}

function volverMenu(){

    hablar("Volviendo al menú de juegos");

    setTimeout(function(){

        location.href="juega.html";

    },1500);
}

function crearEstrellasFondo(){

    const fondo = document.getElementById("fondo-estrellas");

    for(let i=0;i<60;i++){

        let estrella = document.createElement("div");
        estrella.innerHTML = "⭐";

        estrella.style.position = "absolute";
        estrella.style.left = Math.random()*100 + "%";
        estrella.style.top = Math.random()*100 + "%";
        estrella.style.fontSize = (Math.random()*12+8) + "px";
        estrella.style.opacity = Math.random();

        fondo.appendChild(estrella);
    }
}

function lanzarConfeti(){

    const emojis = ["🎉","🎊","⭐","✨","🎈"];

    for(let i=0;i<80;i++){

        let confeti = document.createElement("div");
        confeti.className = "confeti";

        confeti.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];

        confeti.style.left = Math.random()*100 + "vw";
        confeti.style.fontSize = (Math.random()*20+10) + "px";
        confeti.style.animationDuration = (Math.random()*2+2) + "s";

        document.body.appendChild(confeti);

        setTimeout(() => {
            confeti.remove();
        }, 4000);
    }
}

</script>

</body>
</html>
